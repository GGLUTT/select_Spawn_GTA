<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вибір Спавна</title>
    <link rel="stylesheet" href="newstyle.css">
    <script src="./script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bcg">
        <div class="wave"></div> <!-- Окрема хвиля -->
    </div>
    

   <div class="header-container">
    <div class="icon-with-text">
        <h1 class="vibor">ВЫБОР</h1>
        <div class="icon-container">
            <img src="./img/icons/navigate.png" alt="icon-navigate" class="icon-navigate">
        </div>
    </div>
    <h2 class="vibor second">СПАВНА</h2>
</div>


    <div class="content-wrapper">
        <div class="select-spawn-container">
            <div class="select-spawn">
                <div class="model-wrapper">
                    <div class="model first">
                        <div class="model second">
                            <img src="./img/icons/accses-spawn.png" alt="accses-spawn" class="accses-spawn">
                        </div>
                    </div>
                </div>
                <div class="text-content">
                    <h1 class="text-teg first">МЕСТО ВЫХОДА</h1>
                    <h2 class="text-teg second">ПОСЛЕДНЕЕ МЕСТО ГДЕ ВЫ БЫЛИ</h2>
                </div>
            </div>

            <div class="select-spawn">
                <div class="model-wrapper">
                    <div class="model first">
                        <div class="model second">
                            <img src="./img/icons/accses-spawn.png" alt="accses-spawn" class="accses-spawn">
                        </div>
                    </div>
                </div>
                <div class="text-content">
                    <h1 class="text-teg first">НАЧАЛЬНАЯ ПОЗИЦИЯ №1</h1>
                    <h2 class="text-teg second">МЕСТО ГДЕ ПОЯВЛЯЮТЬСЯ НОВИНЬКИЕ НУ ИЛИ ТЕ У КОТОРЫХ</h2>
                </div>
            </div>

            <div class="select-spawn">
                <div class="model-wrapper">
                    <div class="model first">
                        <div class="model second">
                            <img src="./img/icons/accses-spawn.png" alt="accses-spawn" class="accses-spawn">
                        </div>
                    </div>
                </div>
                <div class="text-content">
                    <h1 class="text-teg first">ФРАКЦИЯ</h1>
                    <h2 class="text-teg second">МЕСТО ГДЕ ВЫ РАБОТАЕТЕ</h2>
                </div>
            </div>

            <!-- 🔒 Заблокована кнопка -->
            <div class="select-spawn blocked">
                <div class="model-wrapper">
                    <div class="model first">
                        <div class="model second">
                            <img src="./img/icons/block-spawn.png" alt="blocked-spawn" class="accses-spawn">
                        </div>
                    </div>
                </div>
                <div class="text-content">
                    <h1 class="text-teg first">ДОМ</h1>
                    <h2 class="text-teg second">ЭТА ПОЗИЦИЯ НЕДОСТУПНА</h2>
                </div>
            </div>
        </div>

        <button class="accept-button">
            <span class="text-spawn-main">СПАВН</span>
        </button>
    </div>

</body>
</html>
